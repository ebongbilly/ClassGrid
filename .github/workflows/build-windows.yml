name: Build Windows MSI

on:
  push:
    branches:
      - main # Triggers build on pushes to main
  workflow_dispatch: # Allows manually triggering the build from GitHub UI

jobs:
  build-msi:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Package MSI Installer
        # Runs the Gradle task on the Windows virtual runner
        run: ./gradlew packageMsi

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-msi
          path: "**/build/compose/binaries/main/msi/*.msi"
          if-no-files-found: error